<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tu Be'av</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#5b1a35;
    --wine-deep:#3d1024;
    --rose:#d9718c;
    --blush:#f7e3de;
    --cream:#fbf3ec;
    --gold:#c9974c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 50% 0%, var(--blush) 0%, var(--cream) 55%, var(--cream) 100%);
    font-family:'Quicksand', sans-serif;
    overflow:hidden;
    touch-action: manipulation;
    -webkit-user-select:none;
    user-select:none;
  }
  #stage{
    position:relative;
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:6vh 6vw;
  }
  .vine-line{
    position:absolute;
    left:0; right:0;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:0.35;
  }
  .vine-top{ top:8%; }
  .vine-bottom{ bottom:10%; }
  #question{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-style:italic;
    color:var(--wine-deep);
    font-size:clamp(30px, 8vw, 46px);
    text-align:center;
    margin:0 0 8vh 0;
    letter-spacing:0.3px;
    line-height:1.25;
  }
  button{
    border:none;
    border-radius:999px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    cursor:pointer;
    -webkit-user-select:none;
    user-select:none;
    touch-action: manipulation;
  }
  #yes{
    position:relative;
    background:var(--wine);
    color:var(--cream);
    padding:18px 44px;
    font-size:20px;
    box-shadow:0 8px 24px rgba(91,26,53,0.35);
    transition:transform 0.35s cubic-bezier(.34,1.56,.64,1), box-shadow 0.35s ease;
    transform-origin:center;
    z-index:2;
  }
  #no{
    position:fixed;
    left:50%;
    top:64%;
    transform:translate(-50%,-50%);
    background:transparent;
    color:var(--wine);
    border:1.5px solid var(--rose);
    padding:16px 38px;
    font-size:18px;
    transition:left 0.25s ease, top 0.25s ease, opacity 0.5s ease;
    z-index:3;
  }
  #credit{
    position:fixed;
    top:14px;
    left:16px;
    font-size:11px;
    color:var(--wine);
    opacity:0.35;
    letter-spacing:0.2px;
    z-index:4;
  }
  #hint{
    position:absolute;
    bottom:6vh;
    left:0; right:0;
    font-size:13px;
    color:var(--wine);
    opacity:0.45;
    text-align:center;
    letter-spacing:0.5px;
    padding:0 8vw;
  }

  #celebration{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background: radial-gradient(circle at 50% 30%, #f4d2de 0%, var(--wine) 100%);
    text-align:center;
    padding:8vw;
    z-index:10;
  }
  #celebration.show{ display:flex; }
  #celebration h1{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    color:var(--cream);
    font-size:clamp(32px, 9vw, 54px);
    margin:0 0 18px 0;
    line-height:1.2;
    opacity:0;
    transform:translateY(14px);
    animation:rise 0.9s ease forwards 0.15s;
  }
  #celebration .heart{
    font-size:clamp(44px, 12vw, 70px);
    opacity:0;
    transform:translateY(14px) scale(0.8);
    animation:rise 0.9s ease forwards 0.4s;
    color:var(--gold);
  }
  @keyframes rise{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .petal{
    position:absolute;
    top:-40px;
    font-size:20px;
    color:var(--gold);
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:1;
    will-change:transform, opacity;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:0.9; }
    100%{ transform:translateY(110vh) rotate(360deg); opacity:0; }
  }
</style>
</head>
<body>

<div id="credit">All rights reserved to Idan</div>

<div id="stage">
  <div class="vine-line vine-top"></div>
  <div class="vine-line vine-bottom"></div>

  <p id="question">Do you love me?</p>

  <button id="yes" type="button">yes</button>
  <button id="no" type="button">no</button>

  <p id="hint">go on, try the other one</p>
</div>

<div id="celebration">
  <div class="heart">&#9825;</div>
  <h1>Happy Tu Be'av<br>Nuna</h1>
</div>

<script>
(function(){
  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const hint = document.getElementById('hint');
  const celebration = document.getElementById('celebration');

  const MAX_DODGES = 30;
  let dodges = 0;
  let removed = false;
  let lastTrigger = 0;

  function pickPosition(){
    const margin = 24;
    const w = noBtn.offsetWidth;
    const h = noBtn.offsetHeight;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const yesRect = yesBtn.getBoundingClientRect();
    const yesCX = yesRect.left + yesRect.width / 2;
    const yesCY = yesRect.top + yesRect.height / 2;

    const minDist = Math.max(vw, vh) * 0.42;

    let x, y, tries = 0;
    let best = null, bestDist = -1;
    do {
      x = margin + w / 2 + Math.random() * (vw - w - margin * 2);
      y = margin + h / 2 + Math.random() * (vh - h - margin * 2);
      const d = Math.hypot(x - yesCX, y - yesCY);
      if (d > bestDist) { bestDist = d; best = { x, y }; }
      tries++;
    } while (bestDist < minDist && tries < 25);

    return best;
  }

  function moveNo(){
    if (removed) return;
    const pos = pickPosition();
    noBtn.style.left = pos.x + 'px';
    noBtn.style.top = pos.y + 'px';

    dodges++;
    const growth = Math.min(1 + dodges * 0.045, 1.9);
    yesBtn.style.transform = 'scale(' + growth.toFixed(2) + ')';

    if (dodges === 3) hint.textContent = "it's okay, yes is right there";
    else if (dodges === 10) hint.textContent = "you can stop trying, i'll wait";
    else if (dodges === 20) hint.textContent = "almost out of moves...";
    else if (dodges >= MAX_DODGES) {
      removed = true;
      hint.textContent = "looks like it's just yes now";
      noBtn.style.opacity = '0';
      noBtn.style.transform += ' scale(0.6)';
      setTimeout(function(){ noBtn.style.display = 'none'; }, 500);
    }
  }

  function handleTrigger(e){
    e.preventDefault();
    const now = Date.now();
    if (now - lastTrigger < 300) return;
    lastTrigger = now;
    moveNo();
  }

  noBtn.addEventListener('pointerdown', handleTrigger, {passive:false});
  noBtn.addEventListener('touchstart', handleTrigger, {passive:false});
  noBtn.addEventListener('click', handleTrigger, {passive:false});

  function launchPetals(){
    const symbols = ['&#9825;','&#10022;'];
    for (let i = 0; i < 26; i++){
      const p = document.createElement('div');
      p.className = 'petal';
      p.innerHTML = symbols[Math.random() < 0.7 ? 0 : 1];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.animationDuration = (3 + Math.random() * 2.5) + 's';
      p.style.animationDelay = (Math.random() * 1.2) + 's';
      p.style.fontSize = (14 + Math.random() * 18) + 'px';
      celebration.appendChild(p);
    }
  }

  yesBtn.addEventListener('click', function(){
    celebration.classList.add('show');
    launchPetals();
  });
})();
</script>

</body>
</html>
